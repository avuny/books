name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs cancel superseded runs; deploys on main are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turborepo package names: the "name" field in each app's package.json. EDIT THESE.
  API_PACKAGE: "@avuny/books-server"
  WEB_PACKAGE: "@avuny/books-web"
  TURBO_TELEMETRY_DISABLED: "1"
  # Optional Turborepo remote cache (speeds up the second install/build):
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the version from the "packageManager" field in the root package.json.
      # If you don't have that field, add:  with: { version: 10 }
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Add lint / test here once they are defined as tasks in turbo.json.
      - name: Check wrangler vars
        run: node scripts/check-wrangler-vars.mjs

      - run: pnpm turbo run typecheck build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Runs on pushes to main and manual runs, never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema first, so the new API never runs against old tables. Fails closed: without the
      # PRODUCTION_DATABASE_URL secret (production environment) the deploy stops here instead of shipping
      # code that needs tables that do not exist. The seed is a deploy-time sync of system data only:
      # system roles and permissions, sidebar, units, and default accounting for orgs that lack it
      # (existing org accounts are never changed). Both steps are idempotent.
      - name: Migrate database and sync seed data
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # The seed loads the API config, which validates these; they are not used by the seed itself.
          ACCESS_TOKEN_SECRET: ci-seed-placeholder-secret-0000000000
          VERIFICATION_TOKEN_SECRET: ci-seed-placeholder-secret-0000000000
          OTP_SECRET: ci-seed-placeholder-secret-0000000000
          AUDIT_HMAC_SECRET: ci-seed-placeholder-secret-0000000000
          RESEND_API_KEY: ci-seed-placeholder
          EMAIL_FROM: ci@example.com
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set in the production environment. Add it, or apply migrations and run the seed by hand and re-run this job."
            exit 1
          fi
          pnpm --filter @avuny/contracts build
          pnpm --filter @avuny/db build
          pnpm --filter @avuny/db db:migrate
          # Verify: the newest migration in the journal must be recorded as applied before we deploy.
          # drizzle stores each applied migration's journal timestamp (created_at).
          expected=$(node -e 'const e=require("./packages/db/drizzle/meta/_journal.json").entries;console.log(e[e.length-1].when)')
          applied=$(psql "$DATABASE_URL" -tA -c 'select coalesce(max(created_at), 0) from drizzle.__drizzle_migrations')
          echo "newest migration in journal: $expected, newest applied: $applied"
          if [ "$applied" -lt "$expected" ]; then
            echo "::error::The newest migration is not applied. Not deploying."
            exit 1
          fi
          pnpm seed

      # API first, so the web app never goes live pointing at an API that isn't there.
      - name: Deploy API (Worker)
        run: pnpm turbo run deploy --filter="${{ env.API_PACKAGE }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # turbo runs the web app's own build first (see turbo.json), then `wrangler deploy`.
      - name: Deploy web app (Worker + static assets)
        run: pnpm turbo run deploy --filter="${{ env.WEB_PACKAGE }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the frontend build. Use "/api" if both Workers share one domain.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  # Post-deploy smoke test (docs/TESTING-PLAN.md section 6, the checks that need no login).
  # It marks the run red when production is broken after a deploy. It cannot undo the deploy.
  smoke:
    name: Post-deploy smoke test
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.SMOKE_API_URL || 'https://hono-worker-api.khaledeveloper.workers.dev' }}
      WEB_URL: ${{ vars.SMOKE_WEB_URL || 'https://avuny-books-web.khaledeveloper.workers.dev' }}
    steps:
      - name: API health, web shell and CORS preflight
        run: |
          fail=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/health" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "API health: $code"; [ "$code" = 200 ] || { echo "::error::API /api/health is not 200"; fail=1; }
          web=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/" || true)
          echo "Web: $web"; [ "$web" = 200 ] || { echo "::error::Web origin is not 200"; fail=1; }
          hdrs=$(curl -s -i -X OPTIONS "$API_URL/api/auth/sign-in" \
            -H "Origin: $WEB_URL" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | tr -d '\r')
          echo "$hdrs" | grep -qi "^access-control-allow-origin: $WEB_URL\$" || { echo "::error::CORS preflight does not allow the web origin"; fail=1; }
          echo "$hdrs" | grep -qi '^access-control-allow-credentials: true' || { echo "::error::CORS preflight does not allow credentials"; fail=1; }
          exit $fail
