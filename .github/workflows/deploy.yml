name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs cancel superseded runs; deploys on main are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turborepo package names: the "name" field in each app's package.json. EDIT THESE.
  API_PACKAGE: "@avuny/books-server"
  WEB_PACKAGE: "@avuny/books-web"
  TURBO_TELEMETRY_DISABLED: "1"
  # Optional Turborepo remote cache (speeds up the second install/build):
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the version from the "packageManager" field in the root package.json.
      # If you don't have that field, add:  with: { version: 10 }
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Add lint / test here once they are defined as tasks in turbo.json.
      - run: pnpm turbo run typecheck build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Runs on pushes to main and manual runs, never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema first, so the new API never runs against old tables. Skipped (with a notice) until the
      # PRODUCTION_DATABASE_URL secret exists in the "production" environment. Both steps are idempotent.
      - name: Migrate database and sync seed data
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # The seed loads the API config, which validates these; they are not used by the seed itself.
          ACCESS_TOKEN_SECRET: ci-seed-placeholder-secret-0000000000
          VERIFICATION_TOKEN_SECRET: ci-seed-placeholder-secret-0000000000
          OTP_SECRET: ci-seed-placeholder-secret-0000000000
          AUDIT_HMAC_SECRET: ci-seed-placeholder-secret-0000000000
          RESEND_API_KEY: ci-seed-placeholder
          EMAIL_FROM: ci@example.com
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL is not set: skipping migrate and seed. Run them by hand."
            exit 0
          fi
          pnpm --filter @avuny/contracts build
          pnpm --filter @avuny/db build
          pnpm --filter @avuny/db db:migrate
          pnpm seed

      # API first, so the web app never goes live pointing at an API that isn't there.
      - name: Deploy API (Worker)
        run: pnpm turbo run deploy --filter="${{ env.API_PACKAGE }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # turbo runs the web app's own build first (see turbo.json), then `wrangler deploy`.
      - name: Deploy web app (Worker + static assets)
        run: pnpm turbo run deploy --filter="${{ env.WEB_PACKAGE }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the frontend build. Use "/api" if both Workers share one domain.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
