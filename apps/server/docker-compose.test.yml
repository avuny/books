# Local test database that speaks the SAME driver as production (Neon HTTP):
#   docker compose -f docker-compose.test.yml up -d --wait
# Postgres plus the community Neon HTTP proxy used in Neon's own local-development guide.
# Both are throw-away: Postgres keeps its data in memory, so `down` leaves nothing behind.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avuny_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avuny_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/avuny_test
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
